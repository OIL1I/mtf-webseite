# Cloudflare Worker für die MTF-Buchungs-API
name = "mtf-api"
main = "src/index.ts"
compatibility_date = "2025-10-01"

[[d1_databases]]
binding = "DB"
database_name = "mtf-db"
# Nach `wrangler d1 create mtf-db` die echte ID hier eintragen:
database_id = "54b719c7-cc31-4e5d-84c8-43a9bc8889da"

[vars]
# Origin der GitHub-Pages-Seite, z.B. "https://DEINNAME.github.io"
SITE_ORIGIN = "https://mtf.ff-horst-eiberg.de"
# Vollständige URL der Seite inkl. Pfad, z.B. "https://DEINNAME.github.io/mtf-webseite/"
SITE_URL = "https://mtf.ff-horst-eiberg.de"
MAIL_FROM = "MTF-Buchung <mtf@ff-horst-eiberg.de>"
TELEGRAM_BOT_USERNAME = "MtfHorstEibergBot"
VAPID_SUBJECT = "mailto:buchungen.oil1i.de-m.repaint356@passmail.net"
VAPID_PUBLIC_KEY = "BP-AwXm0i9vpPQKgb5NuSJH6TQ49fvQvxF-He44q2g8GrtIVgzTw9KXzzGaWgm_YyGpmvUT6hUmdUejBmfRCjYg"
# Nur für lokale Entwicklung: Magic-Link-Token in der API-Antwort zurückgeben statt E-Mail zu senden
DEV_MODE = "0"

# Secrets (per `wrangler secret put NAME` setzen, nicht hier eintragen):
#   MASTER_PASSWORD           – Master-Passwort für den Verwaltungszugang (#/master, nur Konten anlegen)
#   RESEND_API_KEY            – API-Key von resend.com für Magic-Link-Mails
#   TELEGRAM_BOT_TOKEN        – Token vom BotFather
#   TELEGRAM_WEBHOOK_SECRET   – frei gewählter Zufallswert, schützt den Webhook
#   VAPID_PRIVATE_JWK         – aus `npm run vapid`
# Für die lokale Entwicklung stehen Secrets in worker/.dev.vars (nicht eingecheckt).
